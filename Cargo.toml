[workspace]
resolver = "2"
members = ["crates/vaultwrap-core", "crates/vaultwrap", "crates/vaultwrap-desktop"]
default-members = ["crates/vaultwrap-core", "crates/vaultwrap"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/joshuagoodman/vaultwrap"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal", "fs"] }

# Argon2 is unbearably slow unoptimized; keep dev/test unlocks fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
